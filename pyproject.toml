[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-agent-mcp"
version = "0.1.0"
description = "Autonomous sales agent MCP server — stateful, multi-tenant, built on edge-llm-core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["mcp", "sales", "crm", "agent", "llm", "edge-llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "edge-llm-core>=0.1.0",
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
hosted = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "stripe>=7.0.0"]
redis  = ["redis>=5.0.0"]
all    = ["sales-agent-mcp[hosted,redis]"]
dev    = ["pytest>=8.0", "build", "twine"]

[project.scripts]
sales-agent-mcp = "sales_agent_mcp.server:main"

[project.urls]
Homepage   = "https://github.com/dado458/sales-agent-mcp"
Repository = "https://github.com/dado458/sales-agent-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
